name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows MSVC x64, os: windows-latest, configure: "-A x64", config: Release }
          - { name: Windows MSVC x64 Debug, os: windows-latest, configure: "-A x64", config: Debug }
          - { name: Windows MSVC x86, os: windows-latest, configure: "-A Win32", config: Release }
          - { name: Linux GCC, os: ubuntu-latest, configure: "-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++", config: Release }
          - { name: Linux Clang, os: ubuntu-latest, configure: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++", config: Release }
          - { name: Linux ARM64 GCC (NEON), os: ubuntu-24.04-arm, configure: "", config: Release }
          - { name: macOS ARM64 Clang (NEON), os: macos-latest, configure: "", config: Release }
          - { name: Linux GCC sanitizers, os: ubuntu-latest, configure: "-DNumberTextThreeEnableSanitizers=Yes", config: RelWithDebInfo }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check formatting
        run: |
          pip install clang-format==20.1.8
          git ls-files '*.h' '*.c' '*.cpp' | xargs clang-format --dry-run --Werror
